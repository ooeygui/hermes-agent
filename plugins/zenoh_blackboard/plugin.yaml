name: zenoh_blackboard
version: "0.1.0"
description: >
  Shared blackboard for multi-agent collaboration. Agents create topics,
  write entries, and subscribe to each other's work in real-time via Zenoh
  peer-to-peer pub/sub with durable SQLite cold-storage.
author: hermes-agent contributors
license: Apache-2.0
kind: plugin
pip_dependencies:
  - eclipse-zenoh>=1.0.0
